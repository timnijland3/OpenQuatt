<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 650" role="img" aria-labelledby="title desc">
  <title id="title">Stap 7: eindcontrole en inschakelen</title>
  <desc id="desc">Controleer M1, OTT, precies één ketelroute en de overige aansluitingen. Voed daarna de HCQ en schakel de buitenunits in.</desc>
  <style>
    text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #111827; }
    .kicker { font-size: 14px; font-weight: 850; letter-spacing: 1.2px; fill: #ea580c; }
    .title { font-size: 24px; font-weight: 820; letter-spacing: -.4px; }
    .item { font-size: 15px; font-weight: 700; }
    .finish { font-size: 17px; font-weight: 820; fill: #fff; }
  </style>
  <rect width="430" height="650" rx="22" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="22" y="34" class="kicker">07 · EINDCONTROLE</text>
  <text x="22" y="70" class="title">Controleer eerst. Schakel daarna in.</text>
  <svg x="110" y="92" width="210" height="230" viewBox="70 2625 220 220" preserveAspectRatio="xMidYMid meet">
    <image href="q-edition-kabels-stappen.svg" width="1000" height="2901"/>
  </svg>
  <circle cx="35" cy="350" r="12" fill="#dcfce7"/><path d="M29 350l5 5 9-11" fill="none" stroke="#15803d" stroke-width="3"/>
  <text x="57" y="356" class="item">M1: A → A, G → GND en B → B.</text>
  <circle cx="35" cy="396" r="12" fill="#dcfce7"/><path d="M29 396l5 5 9-11" fill="none" stroke="#15803d" stroke-width="3"/>
  <text x="57" y="390" class="item">OTT is aangesloten.</text>
  <text x="57" y="410" class="item">De ketel via OTB óf R1, nooit beide.</text>
  <circle cx="35" cy="442" r="12" fill="#dcfce7"/><path d="M29 442l5 5 9-11" fill="none" stroke="#15803d" stroke-width="3"/>
  <text x="57" y="448" class="item">Q en alle overige stekkers zitten stevig vast.</text>
  <circle cx="35" cy="488" r="12" fill="#dcfce7"/><path d="M29 488l5 5 9-11" fill="none" stroke="#15803d" stroke-width="3"/>
  <text x="57" y="494" class="item">M2 is alleen voor Quatt-app via CiC aangesloten.</text>
  <rect x="20" y="536" width="390" height="88" rx="14" fill="#166534"/>
  <text x="215" y="571" text-anchor="middle" class="finish">Voed de HCQ via USB.</text>
  <text x="215" y="598" text-anchor="middle" class="finish">Schakel daarna de Quatt-buitenunit(s) in.</text>
</svg>
